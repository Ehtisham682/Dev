<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nft preview card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="card">
        <img src="/images/image-equilibrium.jpg" alt="" />

        <div>
          <h1>Equilibrium #3429</h1>
          <p class="eth-p">
            Our Equilibrium collection promotes balance and calm.
          </p>
        </div>
        <span>
          <span class="eth">
            <img src="/images/icon-ethereum.svg" alt="Ethereum Icon" /><b> 0.041 ETH</b>
          </span>
          <span class="time">
            <img src="/images/icon-clock.svg" alt="time icon" />3 days left
          </span>
        </span>
        <hr />
        <div class="profile">
          <img src="/images/image-avatar.png" alt="profile" />
          <span><b>Creation of <span class="profile">Juls Weyvern</span></b></span>
        </div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Types</title>
    <script src="script.js"></script>
</head>
<body>
    <h1>Data Types in JavaScript</h1>

    <h2>two types of datatypes in JS</h2>
    <li>
        
        <h3>1. Primitive Data Types</h3>
        <ul>
            <li>String</li>
            <li>Number</li>
            <li>Boolean</li>
            <li>Undefined</li>
            <li>Null</li>
            <li>Symbol</li>
            <li>BigInt</li>
        </ul>
    </li>
    <li>
        <h3>2. Non-Primitive Data Types (Reference Types)</h3>
        <ul>
            <li>Object</li>
            <li>Array</li>
            <li>Function</li>
            <li>Date</li>
            <li>RegExp</li>
        </ul>
    </li>

</body>
</html>

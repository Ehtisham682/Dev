<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Synchronous and Asynchronous JavaScript</title>
		<script src="script.js" defer></script>
	</head>
	<body>
		<h1>XMLHttpRequest</h1>
		<p>
			<b>Synchronous</b> code runs one line at a time, in order. Each line must
			finish before the next starts.<br /><b>Asynchronous</b> code starts a slow
			task (a network request, a timer, a file read), carries on with the next
			lines, and handles the result later when it's ready.
		</p>
		<button>Random Image</button>
		<img src="" style="width: 350px" />
	</body>
</html>

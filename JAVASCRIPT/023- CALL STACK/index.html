	<body>
		<h1>Call Stack</h1>
		<h2>
			call stack is a mechanism for an interpreter (like the JavaScript
			interpreter in a web browser) to keep track of its place in a script that
			calls multiple functions — what function is currently being run and what
			functions are called from within that function, etc.
		</h2>

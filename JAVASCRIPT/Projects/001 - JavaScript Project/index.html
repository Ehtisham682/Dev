<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Focus on Today</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<main>
			<h1 class="main-Heading"><span>Focus on &nbsp;</span> Today</h1>

			<div class="app-container">
				<h2 class="sub-heading">
					Today <img class="sun-image" src="/media/Sun.svg" />
					<img class="sun-face" src="/media/sun-face.png" />
				</h2>

				<p class="progress-label">Raise the bar by completing your goals!</p>
				<div class="progress-bar">
					<div class="myBar"><span>2/3 Completed</span></div>
					<p class="warning-label">Please set all the 3 goals!</p>
				</div>

				<div class="goal-container">
					<div class="goal-checkbox">
						<img class="check-icon-image" src="/media/check-icon.svg" />
					</div>
					<input
						class="goal-input"
						type="text"
						placeholder="Add new goal... "
					/>
				</div>
				<div class="goal-container">
					<div class="goal-checkbox">
						<img class="check-icon-image" src="/media/check-icon.svg" />
					</div>
					<input
						class="goal-input"
						type="text"
						placeholder="Add new goal... "
					/>
				</div>
				<div class="goal-container">
					<div class="goal-checkbox">
						<img class="check-icon-image" src="/media/check-icon.svg" />
					</div>
					<input
						class="goal-input"
						type="text"
						placeholder="Add new goal... "
					/>
				</div>
				<p class="quote">“Move one step ahead, today!”</p>
				<p class="made-by">Made with ❤️ by Ehtisham</p>
			</div>
		</main>
	</body>
</html>

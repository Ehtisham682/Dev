<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pop Up</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&family=Inika:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<script src="script.js" defer></script>
	</head>
	<body>
		<div class="btn-container">
		<button class="button">Get Newsletter</button>
		</div>
		<div class="popup-container">
			<div class="pop-up">
				<span class="close-icon">&times;</span>
				<div class="message">
					<h2>Don’t miss out.</h2>
					<p>Sign up for our newsletter to stay in the loop.</p>
				</div>
				<img src="/img.svg" alt="" />
				<div class="input">
					<input class="input-field" type="text" placeholder="EMAIL ADDRESS ">
					<div class="input-msg"><p>SUBSCRIBE</p></div>
				</div>
			</div>
		</div>
	</body>
</html>

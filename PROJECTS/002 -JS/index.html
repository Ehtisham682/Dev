<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
		<title>Foodie Burgers</title>
	</head>
	<body>
		<div class="main-content">
			<header class="nav-header">
				<div class="header-content">
					<div class="icon">
						<img
							class="burger-logo"
							src="/media/foodie hamburger logo.svg"
							alt="burger icon"
						/>
					</div>
					<div class="burger-container">
						<div class="burger-menu">
							<span class="menu-icon">&#9776;</span>
						</div>
					</div>
					<nav class="navigation-bar">
						<span class="menu-close-icon">&times;</span>
						<a class="navigation-links" href="#top-picks">Top Picks</a>
						<a class="navigation-links" href="#whopper">Whoppers</a>
						<a class="navigation-links" href="#stunner-menu">Stunner Menu</a>
						<a class="navigation-links" href="#new-foodie-collection"
							>New foodie Collection</a
						>
						<a class="navigation-links" href="#deals">Deal of the Day</a>
					</nav>
				</div>
			</header>
			<main>
				<section class="hero-section">
					<div class="img-container">
						<img class="main-image" src="/media/1.png" alt="burgers picture" />
					</div>
					<p>Well, You can’t resist anymore!</p>
				</section>
				<section id="top-picks" class="section">
					<div class="img-container">
						<h2>Top Picks</h2>
						<img class="main-image" src="/media/2.png" alt="burgers picture" />
					</div>
				</section>
				<section id="whopper" class="section">
					<div class="img-container">
						<h2>Whopper</h2>
						<img class="main-image" src="/media/3.png" alt="burgers picture" />
					</div>
				</section>
				<section id="stunner-menu" class="section">
					<div class="img-container">
						<h2>Stunner Menu</h2>
						<img class="main-image" src="/media/4.png" alt="burgers picture" />
					</div>
				</section>
				<section id="new-foodie-collection" class="section">
					<div class="img-container">
						<h2>New Foodie Collection</h2>
						<img class="main-image" src="/media/5.png" alt="burgers picture" />
					</div>
				</section>
				<section id="deals" class="section">
					<div class="img-container">
						<h2>Deal of the Day</h2>
						<img class="main-image" src="/media/6.png" alt="burgers picture" />
					</div>
				</section>
			</main>
		</div>
		<footer>
			<h3 class="move-to-top"><a href="#">Go to Top</a></h3>
			<p>Made by <img src="/media/sym.png" /> Mohd Ehtisham</p>
		</footer>
	</body>
</html>

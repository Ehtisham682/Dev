<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML FORM</title>
  </head>
  <body>
    <h3>HTML FORM</h3>
    <form action="https://www.amazon.in/s">
      <label for="Amazon">amazon search</label>  <!-- for attribute links the label to input element -->
      <input type="text" id="Amazon" name="k" /> <!-- id attribute uniquely identifies the input element -->
      <button>Search</button>
    </form>

    <form action="https://www.google.com/search">
      <label for="google">google search</label>
      <input type="text" id="google" name="q" />
      <button>Search</button>
    </form>

    <div>
      <form action="">
        <h3>MY FORM</h3>

        <label for="Name">Name</label>
        <input id="Name" type="text" name="name" placeholder="Enter Name" />

        <p>
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="Enter Email"
          />
        </p>

        <p>
          <label for="mobile number">Mobile Number</label>
          <input
            id="mobile number"
            type="number"
            name="Mobile Number"
            placeholder="Enter Mobile Number"
          />
        </p>

        <p>
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter Password"
          />
        </p>

        <p><input type="checkbox" required />Agree to terms and Conditions</p>

        <input type="reset" value="reset" />

        <input type="submit" value="Submit" />
      </form>
    </div>
    <div>
      <form>
        <label for="show">Show</label>
        <input id="show" type="number" name="show">
      </form>
    </div>
  </body>
</html>

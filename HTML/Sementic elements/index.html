<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p><abbr title="HyperText Markup Language">HTML</abbr> is the structure language for creating web pages.</p>
    <p>this is to emphasis a <strong>strong</strong> element</p>
    <p>this is to emphasis a <b>bold</b> element</p>
    <p>this is to emphasis a <em>emphasis</em> element</p>  

    <address>
        <strong>my address</strong>
        <p>
            Airoli<br>
            Navi Mumbai<br>
            Maharashtra<br>
        </p>
        <p>phone no: <a href="tel:+91-1234567890">+91-1234567890</a></p> <!-- tel: value is used to make a phone number clickable and initiate a call when clicked on devices that support calling functionality, such as smartphones. -->
        <p>mail id: <a href="mailto:example@example.com">example@example.com</a></p> <!-- mailto: value is used to create a clickable email link that opens the user's default email client with a new email draft addressed to the specified email address. -->
    </address>
</body>
</html>
